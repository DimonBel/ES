; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    printable
build_src_filter = +<*> -<modules/button> -<modules/app> -<modules/command> -<modules/sound_sensor> -<modules/ds18b20> -<modules/rgb_led> -<modules/keypad> -<modules/joystick> -<modules/led>
build_flags =
    -I src/modules
    -I src/modules/serial_stdio
    -I src/modules/lcd
    -I src/modules/utils
    -I src/modules/actuator
    -I src/modules/signal_conditioner
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    Wire
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
